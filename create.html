<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Faith Foundation - Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2f4f6f;
            --secondary: #f2f6fb;
            --accent: #c9a24d;
            --green: #4CAF50;
            --text-dark: #1f2933;
            --text-light: #6b7280;
            --white: #ffffff;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--secondary) 0%, #e8f0e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '🌱';
            position: absolute;
            font-size: 200px;
            opacity: 0.03;
            top: -50px;
            right: 100px;
            transform: rotate(-15deg);
        }

        body::after {
            content: '✨';
            position: absolute;
            font-size: 150px;
            opacity: 0.03;
            bottom: -30px;
            left: 100px;
            transform: rotate(25deg);
        }

        .container {
            background: var(--white);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(47, 79, 111, 0.15);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, var(--green) 0%, #66BB6A 100%);
            padding: 45px 40px;
            text-align: center;
            color: var(--white);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '🌟';
            position: absolute;
            font-size: 100px;
            opacity: 0.1;
            top: -20px;
            left: -20px;
        }

        .header-icon {
            width: 80px;
            height: 80px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 15px;
            opacity: 0.95;
        }

        .form-container {
            padding: 45px 40px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e0e7ee;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
            background: var(--secondary);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--green);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .terms-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            margin-top: 3px;
            cursor: pointer;
            accent-color: var(--green);
            flex-shrink: 0;
        }

        .terms-checkbox label {
            margin: 0;
            font-weight: 400;
            font-size: 13px;
            color: var(--text-light);
            cursor: pointer;
            line-height: 1.6;
        }

        .terms-checkbox label a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .terms-checkbox label a:hover {
            color: var(--green);
            text-decoration: underline;
        }

        .btn-signup {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--green) 0%, #66BB6A 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-signup:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }

        .btn-signup:active {
            transform: translateY(-1px);
        }

        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e7ee;
        }

        .divider span {
            background: var(--white);
            padding: 0 20px;
            position: relative;
            color: var(--text-light);
            font-size: 13px;
        }

        .signin-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-light);
            font-size: 14px;
        }

        .signin-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .signin-link a:hover {
            color: var(--green);
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-home a:hover {
            color: var(--primary);
        }

        .password-hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .form-container {
                padding: 35px 25px;
            }

            .header {
                padding: 35px 25px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🌱</div>
            <h1>Join Faith Foundation</h1>
            <p>Create your account and start your faith journey</p>
        </div>
        
        <div class="form-container">
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                    <p class="password-hint">At least 8 characters with letters and numbers</p>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required>
                </div>
                
                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a></label>
                </div>
                
                <button type="submit" class="btn-signup">Create Account</button>
                
                <div class="divider">
                    <span>or</span>
                </div>
                
                <div class="signin-link">
                    Already have an account? <a href="signin.html">Sign In</a>
                </div>

                <div class="back-home">
                    <a href="index.html">← Back to Home</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
